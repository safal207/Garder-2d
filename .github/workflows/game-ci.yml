name: Garder playable game verification

on:
  push:
    branches: [main, feat/playable-garden-20261018]
    paths:
      - "project.godot"
      - "scripts/**"
      - "scenes/**"
      - "tests/**"
      - ".github/workflows/game-ci.yml"
  pull_request:
    paths:
      - "project.godot"
      - "scripts/**"
      - "scenes/**"
      - "tests/**"
      - ".github/workflows/game-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  godot:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: write
    env:
      GARDER_SCREENSHOT_PATH: ${{ github.workspace }}/docs/screenshots/garder-demo.png
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Install Godot 4.2.2 and software OpenGL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y unzip xvfb xauth libgl1-mesa-dri libglx-mesa0
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          mv /tmp/Godot_v4.2.2-stable_linux.x86_64 /tmp/godot
          chmod +x /tmp/godot
          /tmp/godot --version
      - name: Godot import and project startup
        run: |
          /tmp/godot --headless --path . --editor --quit
          /tmp/godot --headless --path . --quit-after 8
      - name: Game rules and playable-scene tests
        run: /tmp/godot --headless --path . --script res://tests/smoke.gd
      - name: Capture real Godot gameplay image
        run: |
          mkdir -p docs/screenshots
          timeout 45s xvfb-run -a -s '-screen 0 1280x720x24 +extension GLX' /tmp/godot --path . --rendering-method gl_compatibility
          python3 - <<'PY'
          import pathlib, struct
          path = pathlib.Path('docs/screenshots/garder-demo.png')
          raw = path.read_bytes()
          assert raw.startswith(b'\x89PNG\r\n\x1a\n'), 'Godot did not produce a PNG screenshot'
          w, h = struct.unpack('>II', raw[16:24])
          assert w >= 1024 and h >= 576 and len(raw) > 8000, (w, h, len(raw))
          print('REAL GODOT SCREENSHOT PASS:', w, h, 'bytes:', len(raw))
          PY
      - name: Attach game screenshot and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: garder-gameplay-screenshot
          path: docs/screenshots/garder-demo.png
          if-no-files-found: warn
          retention-days: 14
      - name: Keep the initial verified screenshot in its PR
        if: success() && github.ref_name == 'feat/playable-garden-20261018'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/screenshots/garder-demo.png
          if ! git diff --cached --quiet; then
            git commit -m 'Capture real Godot Garder gameplay screenshot'
            git push origin HEAD:feat/playable-garden-20261018
          fi
